name: Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: 0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run build
      - uses: actions/checkout@v7
        with:
          repository: lvce-editor/lvce-editor
          ref: fdd177b2682bed1fdb377f27e5656432e5376c5c
          path: .tmp/lvce-integration
      - uses: actions/setup-node@v6
        with:
          node-version-file: .tmp/lvce-integration/.nvmrc
      - name: Install application dependencies
        working-directory: .tmp/lvce-integration
        run: npm ci
      - name: Install Chromium
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: npx playwright install --with-deps chromium
      - name: Prepare owned integration tests
        run: node packages/e2e-integration/prepare.mjs .tmp/lvce-integration
      - name: Run owned integration tests
        shell: bash
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        # The 100,000-item capacity test takes close to two minutes on Windows x64;
        # Windows ARM64 needs more time to execute the same assertions.
        run: npm run e2e:headless -- --test-timeout=${{ matrix.os == 'windows-11-arm' && '300000' || '120000' }} '--initial-settings={"statusBar.itemsVisible":true,"statusBar.builtinProblemsEnabled":true,"statusBar.builtinNotificationsEnabled":true}'
